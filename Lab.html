/*
Task #7: Hoisting
Function hoisting means a function declaration can be used before the function is written.
Variable hoisting means a variable declaration is moved tothe top, but the value is not assigned yet.
*/

sayHello();

function sayHello() {
    console.log("Hello!");
}

/*
Variable example:
The variable is declared with var, so the declaration ishoisted. \
The value is undefined until it is assigned.
*/

console.log(myName);

var myName = "Harry";


/*
ECMAScript changed this with let and const. Variables using let and const cannot be used before 
they are declared. This helps prevent problems with
variable hoisting.
