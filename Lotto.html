<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoosier Lottery</title>
</head>
<body>
    <h1>Hoosier Lottery Numbers</h1> 
    <h2>For Loop</h2> <h3 class="forNumbers"> </h3> 
    
    <h2>While Loop</h2> 
    
    <h3 class="whileNumbers"></h3>
    <script>
        
        let forString = ""; 
        for (let num = 0; num < 6; num++) { 
        let randomNum = Math.floor(Math.random() * 49) + 1;
        forString = forString + randomNum + " "; 
        console.log(randomNum); } 
        document.querySelector(".forNumbers").textContent = forString; 
        

        let whileString = ""; 
        let count = 0; while (count < 6) { 
            let randomNum = Math.floor(Math.random() * 49) + 1; 
            whileString = whileString + randomNum + " "; 
            console.log(randomNum); count++; } 
        document.querySelector(".whileNumbers").textContent = whileString;
    </script>
</body>
</html>
